<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEAMS | Dashboard</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary px-4">
        <a class="navbar-brand" href="#">SEAMS - Student Event Attendance Management System</a>
    </nav>

    <div class="container my-4">
        <h2>Dashboard Overview</h2>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Students</h5>
                    <h3>{{ total_students }}</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Total Events</h5>
                    <h3>{{ total_events }}</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Attendance Records</h5>
                    <h3>{{ total_attendance }}</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
